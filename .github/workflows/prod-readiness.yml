name: Production readiness

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: prod-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, smoke, and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production readiness gate
        run: npm run verify:prod

      - name: Build Railway Docker image
        run: docker build -t forgecloud-prod-readiness .
